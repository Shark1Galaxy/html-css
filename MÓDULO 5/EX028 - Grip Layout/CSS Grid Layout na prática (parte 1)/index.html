<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout na prática (parte 1)</title>
    <style>
        .container{
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template-columns: auto auto auto; /*Aqui ele define o tamanho das colunas do grid*/
            grid-template-rows: auto auto auto; /*Aqui ele define o tamanho das linhas do grid*/
            gap: 25px;
        }
        .item{
            border: 3px dashed red;
            padding: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <h1>CSS Grid Layout na prática (parte 1)</h1>
        <div class="container">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>    
            <div class="item">H</div>    
        </div>
    </main>
</body>
</html>
