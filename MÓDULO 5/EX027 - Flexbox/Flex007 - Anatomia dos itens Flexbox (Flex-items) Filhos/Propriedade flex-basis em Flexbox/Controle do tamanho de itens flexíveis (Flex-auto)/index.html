<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX: AUTO</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        section#container { /*Pai*/
            display: flex;
            flex-flow: row nowrap;
            background-color: lightsalmon;       
         }
        div.item{ /*Filho não se da display:flex*/
            background-color: rgb(0, 191, 255);
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
            flex-shrink: 0; /*1 é padrão, ele é true. poois ele permite ele encolher, quando coloca 0 é false, ou seja, n encolher quando quebrar conforme o container*/
            flex-grow: 0;/*0 é padrão, ele é true. poois ele permite ele encolher, quando coloca 0 é false, ou seja, n encolher quando quebrar conforme o container*/
        }

        div.item{ /*Filho não se da display:flex*/
            background-color: rgb(0, 191, 255);
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            padding: 9px; 
        }
        div#A{flex-grow: 0; flex-shrink: 1;}
        div#B{flex-grow: 2; flex-shrink: 0;}
        div#C{flex-grow: 1; flex-shrink: 2;}
    </style>
</head>
<body>
    <main>
        <h1>Tamanhos com basis</h1>
        <h2>Tamanhos fixos com 1 e 0</h2>
        <section id="container">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
        </section>
        <h1>Tamanhos flexiveis de 1 a 2</h1>
        <section id="container">
            <div class="item" id="A">A</div>
            <div class="item" id="B">B</div>
            <div class="item" id="C">C</div>
        </section>
        <img src="Imagens/image.png" width="100%">
    </main>
</body>
</html>
