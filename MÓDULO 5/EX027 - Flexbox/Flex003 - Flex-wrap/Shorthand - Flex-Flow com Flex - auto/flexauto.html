<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX: AUTO</title>
    <style>
        section#container { /*Pai*/
            display: flex;
            background-color: white;
            flex-flow: row wrap;
            margin: 20px;
        }
        section#container2{ /*Pai*/
            display: flex;
            background-color: white;
            flex-flow: row wrap-reverse;
            margin: 20px;
        }
        section#container3 { /*Pai*/
            display: flex;
            background-color: white;
            flex-flow: column wrap;
            margin: 20px;
        }
        section#container4{ /*Pai*/
            display: flex;
            background-color: white;
            flex-flow: column wrap-reverse;
            margin: 20px;
        }
        div.item{ /*Filho não se da display:flex*/
            background-color: rgb(0, 191, 255);
            border: 1px solid black;
            flex: auto; /*Flex auto, faz com que os filhos se adapatem ao container pai */
            text-align: center; /*Centralizar os elementos*/
            padding: 20px;
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <main>
        <h2>Row - wrap</h2>
        <section id="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
        </section>
        <h2>Row - wrap-reverse</h2>
        <section id="container2">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
        </section>
        <h2>collum - wrap</h2>
        <section id="container3">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
        </section>
        <h2>collum - wrap-reverse</h2>
        <section id="container4">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
        </section>
    </main>
</body>
</html>
